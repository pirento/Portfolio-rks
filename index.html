    <!-- Apply the saved theme before first paint to avoid a flash. -->
    <script>
      (function () {
        // Order: host page theme (e.g. Claude preview), saved choice, then the OS setting.
        var host = document.documentElement.getAttribute('data-theme')
        var t = host === 'dark' || host === 'light' ? host : null
        if (!t) {
          try {
            t = localStorage.getItem('theme')
          } catch (e) {}
        }
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.mode = t
      })()
    </script>
